[package]
name = "myc_xtask"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
flate2 = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.17"
toml = "0.8"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[lints]
workspace = true
